name: Envoi Alerte Kite Automatique

on:
  schedule:
    # Every day at 07:00 UTC (08:00 in Paris in winter, 09:00 in summer)
    - cron: "0 7 * * *"
  # Allows a manual run from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alerte_kite:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des bibliothèques
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Tests
        run: pytest

      - name: Exécution du script d'alerte
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          MDP_EMAIL: ${{ secrets.MDP_EMAIL }}
        run: python alerte.py
